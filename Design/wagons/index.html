<h1>Wagon profiles</h1>
<p>Generated from <code>SwissTransit/Panels/Wagon.swift</code> — the same
   <code>WagonBody</code> geometry and <code>WagonMetrics</code> the app draws with.
   Widths are the real vehicle length &times; 3.2&nbsp;pt/m, so these are the
   proportions a 26.4&nbsp;m intercity coach, an 18.7&nbsp;m regional car and an
   18.5&nbsp;m Re&nbsp;460 actually get on screen.</p>
